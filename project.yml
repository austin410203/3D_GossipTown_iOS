name: GossipTown
options:
  bundleIdPrefix: com.austin410203
  deploymentTarget: { iOS: "16.0" }
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  GossipCore: { path: . }
targets:
  GossipTown:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: GameData
        type: folder
    dependencies:
      - package: GossipCore
      - sdk: Speech.framework
      - sdk: AVFoundation.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.austin410203.gossiptown
        PRODUCT_NAME: GossipTown
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Gossip Town
        CFBundleName: Gossip Town
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundlePackageType: APPL
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [zh-Hant, en, ja, ko, es]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        LSApplicationCategoryType: public.app-category.simulation-games
        UILaunchScreen: { UIColorName: LaunchBG }
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: Turns what you say to the residents into text (it goes into the input box first so you can edit it before sending).
        NSSpeechRecognitionUsageDescription: Turns your speech into text for the input box. When your device supports it, recognition happens only on the device; the game never keeps recordings.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        ITSAppUsesNonExemptEncryption: false
